name: Fuzz

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "fuzz/**"
      - "src/airplay.rs"
      - "src/fuzzing.rs"
      - "src/lib.rs"
      - "src/names.rs"
      - "src/services.rs"
      - "src/smb.rs"
      - "src/snapshot.rs"
      - "src/tls.rs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "fuzz/**"
      - "src/airplay.rs"
      - "src/fuzzing.rs"
      - "src/lib.rs"
      - "src/names.rs"
      - "src/services.rs"
      - "src/smb.rs"
      - "src/snapshot.rs"
      - "src/tls.rs"
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - airplay_plist
          - llmnr_ptr
          - netbios_status
          - smb_reply
          - tcp_banner
          - udp_reply
          - tls_cert
    env:
      TARGET: ${{ matrix.target }}
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl target.
      TRIPLE: x86_64-unknown-linux-gnu
      LONG_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly toolchain
        run: rustup toolchain install nightly-2026-11-01 --profile minimal
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore corpus
        if: env.LONG_RUN == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build fuzz target
        run: cargo +nightly-2026-11-01 fuzz build --target "$TRIPLE" "$TARGET"
      - name: Run fuzz target
        run: |
          seconds=60
          if [ "$LONG_RUN" = true ]; then
            seconds=600
          fi
          mkdir -p "corpus/$TARGET"
          cargo +nightly-2026-11-01 fuzz run --target "$TRIPLE" "$TARGET" "corpus/$TARGET" "seeds/$TARGET" -- \
            -max_total_time="$seconds" -rss_limit_mb=2048 -timeout=10
      - name: Save corpus
        if: always() && env.LONG_RUN == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
