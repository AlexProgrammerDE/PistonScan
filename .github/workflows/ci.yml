name: Wails build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      # Failure in one platform build won't impact the others
      fail-fast: false
      matrix:
        build:
          - name: 'pistonscan'
            platform:  'linux/amd64'
            # wails-build-action does not support Ubuntu 26.04, which ubuntu-latest now uses.
            os: 'ubuntu-24.04'
          - name: 'pistonscan'
            platform:  'windows/amd64'
            os: 'windows-latest'
          - name: 'pistonscan'
            platform:  'darwin/universal'
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Lint and check frontend formatting
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run format:check

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Build wails
        uses: dAppServer/wails-build-action@1ed9cb68d194cf664ce7603fdfa353f287fa981f # main
        id: build
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: false
          go-version: '1.23'
