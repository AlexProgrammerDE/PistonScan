name: Rust build

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Formatting and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Format vendored xattr
        run: cargo fmt --manifest-path vendor/xattr/Cargo.toml --check
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  build:
    name: Build and lint (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15.7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test desktop and core
        run: cargo test --locked --all-targets
      - name: Check scanner without desktop dependencies
        run: cargo check --locked --no-default-features
      - name: Build desktop executable
        if: runner.os != 'macOS'
        run: cargo build --locked --release
      - name: Build universal macOS app
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --locked --release --target aarch64-apple-darwin
          mkdir -p build/bin/PistonScan.app/Contents/{MacOS,Resources}
          mkdir -p build/bin/AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" build/appicon.png --out "build/bin/AppIcon.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" build/appicon.png --out "build/bin/AppIcon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns build/bin/AppIcon.iconset -o build/bin/PistonScan.app/Contents/Resources/AppIcon.icns
          cp build/darwin/Info.plist build/bin/PistonScan.app/Contents/Info.plist
          lipo -create target/x86_64-apple-darwin/release/pistonscan target/aarch64-apple-darwin/release/pistonscan -output build/bin/PistonScan.app/Contents/MacOS/pistonscan
          lipo build/bin/PistonScan.app/Contents/MacOS/pistonscan -verify_arch x86_64 arm64
          codesign --force --sign - build/bin/PistonScan.app
      - name: Package release build
        if: inputs.package
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "pistonscan") | .version')
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME does not match crate version $version" >&2
            exit 1
          fi
          mkdir dist
          case "$RUNNER_OS" in
            Linux)
              test "$(target/release/pistonscan --version)" = "PistonScan $version"
              tar -czf "dist/pistonscan-$version-linux-x86_64.tar.gz" \
                -C target/release pistonscan -C ../.. README.md LICENSE
              ;;
            Windows)
              # shellcheck disable=SC2016
              VERSION="$version" pwsh -NoProfile -Command '
                Compress-Archive -LiteralPath @("target/release/pistonscan.exe", "README.md", "LICENSE") -DestinationPath "dist/pistonscan-${env:VERSION}-windows-x86_64.zip"
              '
              ;;
            macOS)
              plutil -lint build/bin/PistonScan.app/Contents/Info.plist
              lipo -info build/bin/PistonScan.app/Contents/MacOS/pistonscan
              ditto -c -k --keepParent build/bin/PistonScan.app "dist/pistonscan-$version-macos-universal.zip"
              ditto -x -k "dist/pistonscan-$version-macos-universal.zip" unpacked
              lipo unpacked/PistonScan.app/Contents/MacOS/pistonscan -verify_arch x86_64 arm64
              codesign --verify unpacked/PistonScan.app
              ;;
          esac
      - name: Upload platform archive
        if: inputs.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
